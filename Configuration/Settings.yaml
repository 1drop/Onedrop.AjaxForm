Neos:
  Neos:
    userInterface:
      translation:
        autoInclude:
          'Onedrop.AjaxForm': ['NodeTypes/*']
    fusion:
      autoInclude:
        'Onedrop.AjaxForm': true
  Fusion:
    defaultContext:
      'Onedrop.AjaxForm': 'Onedrop\AjaxForm\Eel\AjaxFormHelper'
  Flow:
    mvc:
      routes:
        'Onedrop.AjaxForm':
          position: 'start'
Onedrop:
  AjaxForm:
    includeJavascript: true
